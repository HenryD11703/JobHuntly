services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-container
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  jobhuntly-api:
    build:
      context: ./JobHuntlyBackend
      dockerfile: Dockerfile
    container_name: jobhuntly-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=JobHuntlyDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
      - JwtSettings__Secret=ThisIsMySuperSecretKeyForJobHuntlyProject2026!
      - JwtSettings__Issuer=JobHuntly
      - JwtSettings__Audience=JobHuntlyApp
    depends_on:
      - sqlserver

volumes:
  mssql_data:
